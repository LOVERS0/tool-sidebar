name: Bug report
description: Something in ToolSidebar doesn't work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please include the app version from the sidebar header (`⋯` menu / About) and your macOS version.
  - type: input
    id: app-version
    attributes:
      label: ToolSidebar version
      placeholder: e.g. 1.8.5
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: e.g. macOS 15.1 / 26.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened?
      description: Steps to reproduce, expected vs actual.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Screenshots / logs (optional)
      description: Drag screenshots here, or paste output from `~/Library/Application Support/小工具侧边栏/` if relevant.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I tried the latest release.
        - label: I checked existing issues.
